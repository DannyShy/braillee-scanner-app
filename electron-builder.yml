appId: com.hotovo.dotsight
productName: DotSight
copyright: Copyright © 2023 Hotovo
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
extraResources:
  - from: ./resources/AngelinaReader
    to: AngelinaReader
    filter:
      - '**/*'
  - from: ./resources/icons
    to: icons
    filter:
      - '**/*'
  - from: ./resources/liblouis-python
    to: liblouis-python
    filter:
      - '**/*'
  - from: ./resources/naps2-7.4.0-win
    to: naps2-7.4.0-win
    filter:
      - '**/*'
  - from: ./resources/templates
    to: templates
    filter:
      - '**/*'
publish: null

linux:
  category: 'Office'
  target:
    - AppImage
  maintainer: 'Hotovo <dotsight@hotovo.com>'
  synopsis: 'Braille Document Scanner and Recognizer'
  executableName: 'dotsight'
  desktop:
    Name: 'DotSight'
    Comment: 'Braille Document Scanner and Recognizer'
    Terminal: 'false'
    Type: 'Application'
    Categories: 'Office;'
    StartupWMClass: 'dotsight'
  extraResources:
    - from: ./resources/naps2-7.4.0-linux
      to: naps2-7.4.0-linux
      filter:
        - '**/*'
    - from: ./resources/templates
      to: templates
      filter:
        - '**/*'
    - from: ./resources/AngelinaReader
      to: AngelinaReader
      filter:
        - '**/*'
    - from: ./resources/icons
      to: icons
      filter:
        - '**/*'
    - from: ./resources/liblouis-python
      to: liblouis-python
      filter:
        - '**/*'

win:
  target:
    - nsis
  icon: 'resources/icons/icon.png'
  publisherName: 'Hotovo'
  legalTrademarks: 's.r.o.'
  extraResources:
    - from: ./resources/python-3.11.6-embed-amd64
      to: python-3.11.6-embed-amd64
      filter:
        - '**/*'

mac:
  category: 'public.app-category.office'
  target:
    - dmg
  icon: 'resources/icons/icon.icns'
  extraResources:
    # - from: ./resources/naps2-7.4.0-mac
    #   to: naps2-7.4.0-mac
    #   filter:
    #     - '**/*' // to be added to the resources
    - from: ./resources/templates
      to: templates
      filter:
        - '**/*'
    - from: ./resources/AngelinaReader
      to: AngelinaReader
      filter:
        - '**/*'
    - from: ./resources/icons
      to: icons
      filter:
        - '**/*'
    - from: ./resources/liblouis-python
      to: liblouis-python
      filter:
        - '**/*'
