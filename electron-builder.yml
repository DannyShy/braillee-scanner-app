appId: com.hotovo.dotsight
productName: DotSight
copyright: Copyright © 2023 Hotovo
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
extraResources:
  - from: ./resources/AngelinaReader
    to: AngelinaReader
    filter:
      - '**/*'
  - from: ./resources/icons
    to: icons
    filter:
      - '**/*'
  - from: ./resources/liblouis-python
    to: liblouis-python
    filter:
      - '**/*'
  - from: ./resources/os
    to: os
    filter:
      - '**/*'
  - from: ./resources/templates
    to: templates
    filter:
      - '**/*'
publish:
  provider: s3
  region: eu-central-1
  bucket: com.dotsight.dev.app.distribution
  channel: latest

mac:
  target:
    - dmg
  icon: resources/icons/icon.png
  extraResources:
    - from: ./resources/os/darwin
      to: os/darwin
      filter:
        - '**/*'

linux:
  category: 'Office'
  target:
    - AppImage
  maintainer: 'Hotovo <dotsight@hotovo.com>'
  synopsis: 'Braille Document Scanner and Recognizer'
  executableName: 'dotsight'
  desktop:
    Name: 'DotSight'
    Comment: 'Braille Document Scanner and Recognizer'
    Terminal: 'false'
    Type: 'Application'
    Categories: 'Office;'
    StartupWMClass: 'dotsight'
  extraResources:
    - from: ./resources/os/linux
      to: os/linux
      filter:
        - '**/*'

win:
  target:
    - nsis
  icon: 'resources/icons/icon.png'
  publisherName: 'Hotovo'
  legalTrademarks: 's.r.o.'
  extraResources:
    - from: ./resources/os/win32
      to: os/win32
      filter:
        - '**/*'
